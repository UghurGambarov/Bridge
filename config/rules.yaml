# Bridge rule catalogue.
# Logic reads parameters from here; the UI Rules tab and the docs are generated from this file.
# Schema (SPEC §5.3): id, title, text, tier, applies_to, action_on_violation, params,
#   lawful_alternative, source, last_checked, status (verified | to_verify).
# "verified" is used only for Bridge's own design controls; every regulatory claim stays
# "to_verify" until the team has checked the primary source.

# ---------------------------------------------------------------- T4: forbidden
- id: T4-001
  title: No fee payments to personal or agency accounts
  text: "Tuition, accommodation and deposits are paid only to the institution's own account. Paying them to a personal account or a study-abroad agency ('代缴') is refused."
  tier: T4
  applies_to: "Any tuition, accommodation or deposit payment"
  action_on_violation: block
  params: {}
  lawful_alternative: "Pay the institution's official channel from the verified registry. Bridge can draft a verification email to the institution's registry contact."
  source: "Agency 代缴 tuition fraud report (Shanghai Observer): https://www.shobserver.cn/wx/detail.do?id=1147014 ; Chinese Consulate General in Los Angeles warning: https://losangeles.china-consulate.gov.cn/lbqw/lsbhyxz/lstx/202507/t20250704_11665031.htm (TODO: verify)"
  last_checked: "2026-10-17"
  status: to_verify

- id: T4-002
  title: Institutional payee must match the verified registry
  text: "An institutional payment goes only to a payee in Bridge's verified registry, and only if every detail (beneficiary name, account, currency) matches the registry entry."
  tier: T4
  applies_to: "Any payment to an institution"
  action_on_violation: block
  params: {}
  lawful_alternative: "Verify the payment details with the school through the official contact listed in the registry, never through contacts printed on the invoice."
  source: "Bridge design control (registry is the trust anchor)"
  last_checked: "2026-10-17"
  status: verified

- id: T4-003
  title: No use of another person's FX quota (no 分拆购汇)
  text: "The annual FX quota belongs to one person. Using a relative's quota, or splitting one obligation across several people's quotas (分拆购汇), is prohibited and fined by SAFE."
  tier: T4
  applies_to: "Every FX purchase"
  action_on_violation: block
  params: {}
  lawful_alternative: "Use the payer's own remaining quota. For amounts above it, use the documented route: the bank buys the currency against the admission letter, invoice, IDs and relationship proof."
  source: "SAFE violation notice: http://m.safe.gov.cn/safe/2024/0321/24130.html ; Zhong Lun on anti-splitting: https://www.zhonglun.com/research/articles/6642.html ; Dacheng case note: https://shanghai.dacheng.com/Party_2/1540.html (TODO: verify)"
  last_checked: "2026-10-17"
  status: to_verify

- id: T4-004
  title: No private or underground FX
  text: "Private, underground or 'preferential-rate' currency exchange (私下换汇, 地下钱庄) is illegal and can end with frozen bank cards."
  tier: T4
  applies_to: "Every currency exchange"
  action_on_violation: block
  params: {}
  lawful_alternative: "Buy foreign currency through a licensed bank (in production: Bridge's licensed partner bank)."
  source: "MOE Safe Study Abroad advisory: https://m.163.com/dy/article/K0RCDQ0F0556BFNP.html ; consulate warning (Los Angeles), see T4-001 (TODO: verify)"
  last_checked: "2026-10-17"
  status: to_verify

- id: T4-005
  title: No crypto or stablecoin routing
  text: "Bridge never routes money through crypto-assets or stablecoins (USDT etc.)."
  tier: T4
  applies_to: "Every payment"
  action_on_violation: block
  params: {}
  lawful_alternative: "Pay by bank transfer to the registry channel."
  source: "PBoC and others, notice on preventing and dealing with speculation risks in virtual-currency trading (2021) (TODO: verify citation)"
  last_checked: "2026-10-17"
  status: to_verify

- id: T4-006
  title: No payee change because a document says so
  text: "Payee details are never changed because an invoice, email or message asks for it, including hidden text. Bank-detail changes are the classic invoice-redirection scam."
  tier: T4
  applies_to: "Every payment"
  action_on_violation: block
  params: {}
  lawful_alternative: "Re-verify with the school through the official contact listed in the registry. The registered payee stays unchanged."
  source: "Bridge design control (business email compromise / invoice redirection)"
  last_checked: "2026-10-17"
  status: verified

- id: T4-007
  title: No raw account numbers from the model
  text: "Payment tools accept only a payee_channel_id from the verified registry. Any argument containing a raw account number, IBAN or wallet address is refused."
  tier: T4
  applies_to: "Every tool call proposed by the model"
  action_on_violation: block
  params: {}
  lawful_alternative: ""
  source: "Bridge design control (capability restriction)"
  last_checked: "2026-10-17"
  status: verified

- id: T4-008
  title: No bypassing controls
  text: "Requests, from the user or from document content, to skip approval, disable or bypass controls, or enter an 'admin' or 'developer' mode are refused. Approvals stay required."
  tier: T4
  applies_to: "All chat messages and all document content"
  action_on_violation: block
  params: {}
  lawful_alternative: ""
  source: "Bridge design control; OWASP Top 10 for LLM Applications 2025, LLM01 Prompt Injection"
  last_checked: "2026-10-17"
  status: verified

# ---------------------------------------------------------------- T3: act with approval
- id: T3-001
  title: Human approvals required
  text: "Tuition, accommodation, deposits and anything above the T2 caps execute only after every required approver has approved."
  tier: T3
  applies_to: "All T3 payments"
  action_on_violation: require_approval
  params:
    required_approvers: [payer, student]   # roles; set to [payer] for mother-only approval
  lawful_alternative: "Request approval from the payer and the student."
  source: "Bridge design control (dual control; the student can check the fee on the university portal)"
  last_checked: "2026-10-17"
  status: verified

- id: T3-002
  title: Approval bound to the transaction digest
  text: "Each approval signs the SHA-256 digest of the canonical intent. If any field changes after approval, the digest changes and the approval is void ('what you see is what you sign')."
  tier: T3
  applies_to: "All T3 payments"
  action_on_violation: block
  params: {}
  lawful_alternative: ""
  source: "Bridge design control (PSD2-style dynamic linking)"
  last_checked: "2026-10-17"
  status: verified

- id: T3-003
  title: Single-use approvals that expire
  text: "Each approval challenge (nonce) is single-use, bound to one intent, and expires after the configured time."
  tier: T3
  applies_to: "All T3 payments"
  action_on_violation: block
  params:
    ttl_minutes: 15
  lawful_alternative: "Request a fresh approval."
  source: "Bridge design control"
  last_checked: "2026-10-17"
  status: verified

- id: T3-004
  title: Distinct approvers on distinct devices
  text: "Required approvals must come from different people using different enrolled devices."
  tier: T3
  applies_to: "All T3 payments"
  action_on_violation: block
  params: {}
  lawful_alternative: ""
  source: "Bridge design control (dual control)"
  last_checked: "2026-10-17"
  status: verified

# ---------------------------------------------------------------- T2: act within limits
- id: T2-001
  title: Autonomous payments only to the student's own verified account
  text: "The agent may pay automatically only to a same-name, verified account owned by the student."
  tier: T2
  applies_to: "Monthly allowance and other autonomous payments"
  action_on_violation: block
  params: {}
  lawful_alternative: "Pay other payees through the T3 approval flow."
  source: "Bridge design control"
  last_checked: "2026-10-17"
  status: verified

- id: T2-002
  title: Autonomous payment caps
  text: "Autonomous payments are capped per transaction and per rolling 30 days (USD equivalent). Anything above the caps is held for T3 approval."
  tier: T2
  applies_to: "Autonomous payments"
  action_on_violation: require_approval
  params:
    per_transaction_usd: 2000
    rolling_30d_usd: 3000
  lawful_alternative: "Approve the payment through the T3 flow."
  source: "Bridge design control"
  last_checked: "2026-10-17"
  status: verified

- id: T2-003
  title: Anti-splitting for autonomous payments
  text: "Payments to the same payee within 30 days are summed against the cap. Three or more payments within 24 hours, or an explicit request to split a payment so it needs no approval, escalate the whole batch to T3."
  tier: T2
  applies_to: "Autonomous payments"
  action_on_violation: require_approval
  params:
    window_hours: 24
    max_payments_in_window: 2     # the 3rd payment within the window escalates
  lawful_alternative: "Make one payment and approve it through the T3 flow."
  source: "Bridge design control (mirrors anti-structuring practice)"
  last_checked: "2026-10-17"
  status: verified

# ---------------------------------------------------------------- quota
- id: Q-001
  title: Annual personal FX purchase quota
  text: "Each individual may buy up to USD 50,000 of foreign currency per calendar year; unused quota does not carry over."
  tier: policy
  applies_to: "Mainland Chinese individuals buying foreign currency"
  action_on_violation: route_to_documented_purchase
  params:
    annual_limit_usd: 50000
  lawful_alternative: "Above the quota, use the documented route."
  source: "SAFE individual FX administration rules; Bank of China — SAFE FX compliance page (URL: TODO verify)"
  last_checked: "2026-10-17"
  status: to_verify

- id: Q-002
  title: Above-quota purchases use the documented route, never splitting
  text: "An amount above the payer's remaining quota is bought by the payer through the bank against documents proving the real purpose (admission letter, invoice, IDs, relationship proof). It is never split."
  tier: policy
  applies_to: "FX purchases above the payer's remaining quota"
  action_on_violation: route_to_documented_purchase
  params:
    documents: ["Admission letter", "Tuition or accommodation invoice", "Payer's ID card", "Student passport plus visa or student ID", "Proof of relationship (mother to son)"]
  lawful_alternative: "Prepare the document checklist; a bank officer verifies it, then the normal T3 approval follows."
  source: "HSBC China education-payment documents: https://www.hsbc.com.cn/en-cn/international/products/education-payment/ (TODO: verify)"
  last_checked: "2026-10-17"
  status: to_verify

- id: Q-003
  title: Structuring alert (several purchasers, one obligation)
  text: "If two or more different purchasers fund the same beneficiary and reference, the payment is blocked. SAFE monitoring flags five or more people on the same or consecutive days for one recipient; Bridge is deliberately stricter."
  tier: policy
  applies_to: "Every FX purchase with a payment reference"
  action_on_violation: block
  params:
    min_distinct_purchasers: 2
  lawful_alternative: "One payer funds the obligation from their own quota, or through the documented route."
  source: "Zhong Lun on anti-splitting monitoring patterns: https://www.zhonglun.com/research/articles/6642.html (TODO: verify)"
  last_checked: "2026-10-17"
  status: to_verify

# ---------------------------------------------------------------- privacy (PIPL)
- id: P-001
  title: Consent before processing
  text: "Bridge processes a person's documents and data only after that person has given consent for the stated purposes."
  tier: privacy
  applies_to: "All personal information"
  action_on_violation: block
  params:
    purposes: [document_processing, payment_processing, audit_logging]
  lawful_alternative: "Ask the person for consent first."
  source: "Personal Information Protection Law of the PRC (PIPL), Art. 13-14 (TODO: verify)"
  last_checked: "2026-10-17"
  status: to_verify

- id: P-002
  title: PII masking
  text: "Account numbers, emails, passport numbers and personal names are masked in logs and in the UI."
  tier: privacy
  applies_to: "Logs, UI, exports"
  action_on_violation: allow
  params: {}
  lawful_alternative: ""
  source: "PIPL Art. 51 (security measures, de-identification) (TODO: verify)"
  last_checked: "2026-10-17"
  status: to_verify

- id: P-003
  title: Delete my data
  text: "A person can delete their data. Masked audit entries are kept, because the audit chain is the evidence of what the agent did and contains no clear-text PII."
  tier: privacy
  applies_to: "All personal information"
  action_on_violation: allow
  params: {}
  lawful_alternative: ""
  source: "PIPL Art. 47 (deletion) (TODO: verify)"
  last_checked: "2026-10-17"
  status: to_verify

- id: P-004
  title: Data minimisation
  text: "Bridge keeps only what the task needs: raw uploads are not retained, and the agent reads only the payer's quota."
  tier: privacy
  applies_to: "All personal information"
  action_on_violation: block
  params: {}
  lawful_alternative: ""
  source: "PIPL Art. 6 (minimum necessary) (TODO: verify)"
  last_checked: "2026-10-17"
  status: to_verify

# ---------------------------------------------------------------- system
- id: AI-001
  title: AI-generated content is labelled
  text: "Every AI-written output is labelled 'AI-generated · AI生成'."
  tier: system
  applies_to: "All agent messages and AI-written text"
  action_on_violation: allow
  params:
    label: "AI-generated · AI生成"
  lawful_alternative: ""
  source: "Measures for Labelling AI-Generated Synthetic Content (人工智能生成合成内容标识办法), effective 1 Sep 2025 (TODO: verify)"
  last_checked: "2026-10-17"
  status: to_verify

- id: SYS-001
  title: Global freeze (kill switch)
  text: "When the system is frozen, no payment is created, approved or executed."
  tier: system
  applies_to: "All money-moving tools"
  action_on_violation: block
  params: {}
  lawful_alternative: "Wait until an operator lifts the freeze."
  source: "Bridge design control"
  last_checked: "2026-10-17"
  status: verified

- id: SYS-002
  title: Rate limit per session
  text: "Each session may send a limited number of requests per minute."
  tier: system
  applies_to: "Chat and document endpoints"
  action_on_violation: block
  params:
    max_requests: 30
    window_seconds: 60
  lawful_alternative: "Wait a moment and try again."
  source: "Bridge design control; OWASP LLM10 Unbounded Consumption"
  last_checked: "2026-10-17"
  status: verified

- id: SYS-003
  title: Tool allow-list and strict arguments
  text: "Only registered tools can run, with schema-validated arguments (no extra fields). Unknown tools, malformed or inconsistent arguments, and invalid state transitions are denied."
  tier: system
  applies_to: "Every tool call"
  action_on_violation: block
  params: {}
  lawful_alternative: ""
  source: "Bridge design control; OWASP LLM06 Excessive Agency"
  last_checked: "2026-10-17"
  status: verified
