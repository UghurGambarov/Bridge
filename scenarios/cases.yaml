# Bridge scenario suite (SPEC §13). Every case runs on a fresh temp database through the API
# (FastAPI TestClient) with the mock LLM, or a scripted / malicious LLM where specified.
#
# Steps:
#   upload: <sample>            upload_invoice: {make_invoice kwargs}     chat: <text> (attach: true -> last doc)
#   approve: mother|student (device: mother|student)                     agent: [tool calls]  (scripted planner)
#   malicious: [tool calls] | default                                    advance_clock: {months, minutes}
#   freeze: true|false   bank_verify: last   tamper_amount: "x"   tamper_sim: true   delete_data: mother
#   replay_approval: true   why: true
# Placeholders: $doc = last uploaded doc; $last_intent = latest intent (resolved before the turn);
#               $intent = latest intent seen by the scripted planner during its turn.
# Expectations: intent_status, tier, route, rule_ids (subset), signals (subset), no_signals, executed,
#   receipt, card_types (subset), max_tool_tier, fx, zh_numbers_match, why_rules, person_deleted,
#   chain_valid, tamper_detected, payee_unchanged, email_to, notice, lawful_alternative

# ------------------------------------------------------------------ normal
- id: N-01
  category: normal
  title: Correct invoice within quota (Flow 1)
  input: "Upload autumn invoice, 'Please pay this', both approve"
  expected: "Executed after both approvals; receipt"
  owasp: "-"
  stride: "-"
  steps:
    - upload: northbridge_invoice_autumn.pdf
    - chat: "Please pay this invoice."
      attach: true
    - approve: mother
    - approve: student
  expect:
    intent_status: executed
    tier: T3
    executed: true
    receipt: true
    card_types: [zh_summary, payee_check, quota, fx_quote, checklist, intent, approval_status, receipt]

- id: N-02
  category: normal
  title: Invoice due in 2 days
  input: "Upload invoice due 19 Oct 2026"
  expected: "Allowed; 'deadline soon' notice; no fraud signal"
